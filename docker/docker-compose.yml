services:

    # fastapi
    fastapi:
        build:
            context: ..
            dockerfile: docker/api/Dockerfile
        container_name: fastapi
        ports:
          - "8000:8000"
        networks:
          - backend
        restart: unless-stopped
        env_file:
          - ./env/.env.app
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
            interval: 30s
            timeout: 5s
            retries: 3

    # nginx
    nginx:
        image: nginx:stable-alpine3.20-perl
        container_name: nginx
        ports:
          - "80:80"
        volumes:
          - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
          - backend
        restart: always
        depends_on:
            fastapi:
                condition: service_healthy

    # litellm
    litellm:
        image: docker.litellm.ai/berriai/litellm:main-latest
        container_name: litellm
        ports:
          - "4000:4000"
        env_file:
          - ./env/.env.litellm
        restart: unless-stopped
        networks:
          - backend
          - prefect-net
        volumes:
          - ./litellm_proxy/config.yml:/app/config.yml
        command: ["--config", "/app/config.yml", "--port", "4000"]
        depends_on:
            postgres:
                condition: service_healthy

    # Qdrant
    qdrant:
        image: qdrant/qdrant:v1.13.6
        container_name: qdrant
        ports:
          - "6333:6333"
          - "6334:6334"
        volumes:
          - qdrant_data:/qdrant/storage
        networks:
          - backend
          - prefect-net
        restart: unless-stopped


    # redis
    redis:
        image: redis/redis-stack:latest
        container_name: redis
        ports:
          - "6379:6379"
          - "8001:8001" # RedisInsight for development
        volumes:
          - redis_data:/data
        networks:
          - backend
        restart: unless-stopped


    # minio object storage
    minio:
        image: quay.io/minio/minio:latest
        container_name: minio
        entrypoint: ["minio", "server", "--address", "0.0.0.0:9000", "--console-address", "0.0.0.0:9001", "/data"]
        ports:
          - "9000:9000" #s3 API port
          - "9001:9001" # Web Console port
        volumes:
          - minio_data:/data
        networks:
          - prefect-net
          - backend
        restart: unless-stopped
        env_file:
          - ./env/.env.minio


    # prefect architecture
    postgres:
        image: postgres:16
        container_name: postgres
        env_file:
          - ./env/.env.postgres
        volumes:
          - pgdata:/var/lib/postgresql/data
        networks:
          - prefect-net
          - backend
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U prefect"]
            interval: 10s
            timeout: 5s
            retries: 5

    prefect-server:
        image: prefecthq/prefect:3-python3.13
        container_name: prefect-server
        command: prefect server start --host 0.0.0.0
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
          - ./env/.env.postgres
        environment:
            PREFECT_SERVER_API_HOST: 0.0.0.0
        ports:
            # Prefect UI and API
          - "4200:4200"
        networks:
          - prefect-net
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
            interval: 10s
            timeout: 5s
            retries: 10

        restart: unless-stopped

    worker:
        build:
            context: ..
            dockerfile: docker/data_pipeline/Dockerfile
        container_name: prefect-worker
        depends_on:
            prefect-server:
                condition: service_healthy

        environment:
            PREFECT_API_URL: http://prefect-server:4200/api
        command: prefect worker start --pool default-agent-pool --type process
        # volumes:
            # Mount flow code so changes are reflected without rebuilding
          #- ../data_pipeline:/app/data_pipeline
        networks:
          - prefect-net
        restart: unless-stopped

    # Prometheus Monitoring
    prometheus:
        image: prom/prometheus:v3.3.0
        container_name: prometheus
        ports:
          - "9090:9090"
        volumes:
          - prometheus_data:/prometheus
          - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
          - backend
        restart: always
        command:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--web.enable-lifecycle'

    # Grafana Dashboard
    grafana:
        image: grafana/grafana:11.6.0-ubuntu
        container_name: grafana
        ports:
          - "3000:3000"
        volumes:
          - grafana_data:/var/lib/grafana
        env_file:
          - ./env/.env.grafana
        depends_on:
          - prometheus
        networks:
          - backend
        restart: always


    # Node Exporter for system metrics
    node-exporter:
        image: prom/node-exporter:v1.9.1
        container_name: node-exporter
        ports:
          - "9100:9100"
        volumes:
          - /proc:/host/proc:ro
          - /sys:/host/sys:ro
          - /:/rootfs:ro
        command:
          - '--path.procfs=/host/proc'
          - '--path.rootfs=/rootfs'
          - '--path.sysfs=/host/sys'
          - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
        networks:
          - backend
        restart: always

    # PostgreSQL Exporter for Postgres metrics
    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:v0.17.1
        container_name: postgres-exporter
        ports:
          - "9187:9187"
        env_file:
          - ./env/.env.postgres-exporter
        depends_on:
            postgres:
                condition: service_healthy
        networks:
          - backend
        restart: always



volumes:
    pgdata:
    minio_data:
    qdrant_data:
    redis_data:
    prometheus_data:
    grafana_data:

networks:
    backend:
    prefect-net:
        driver: bridge
